version: '3.8'

networks:
  laravel-net:
    driver: bridge

services:

  # ─── Redis ───────────────────────────────────────────
  redis:
    image: redis:alpine
    container_name: redis
    ports:
      - "6379:6379"
    networks:
      - laravel-net

  # ─── User Service ────────────────────────────────────
  user-service-app:
    build:
      context: ./user-service
    container_name: user-service-app
    volumes:
      - ./user-service:/var/www
    networks:
      - laravel-net
    depends_on:
      - user-service-db

  user-service-nginx:
    image: nginx:stable-alpine
    container_name: user-service-nginx
    ports:
      - "8000:80"
    volumes:
      - ./user-service:/var/www
      - ./user-service/nginx.conf:/etc/nginx/conf.d/default.conf
    networks:
      - laravel-net
    depends_on:
      - user-service-app

  user-service-db:
    image: mysql:8
    container_name: user-service-db
    environment:
      MYSQL_DATABASE: user_db
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3307:3306"
    networks:
      - laravel-net

  # ─── Product Service ─────────────────────────────────
  product-service-app:
    build:
      context: ./product-service
    container_name: product-service-app
    volumes:
      - ./product-service:/var/www
    networks:
      - laravel-net
    depends_on:
      - product-service-db
      - redis

  product-service-nginx:
    image: nginx:stable-alpine
    container_name: product-service-nginx
    ports:
      - "8001:80"
    volumes:
      - ./product-service:/var/www
      - ./product-service/nginx.conf:/etc/nginx/conf.d/default.conf
    networks:
      - laravel-net
    depends_on:
      - product-service-app

  product-service-db:
    image: mysql:8
    container_name: product-service-db
    environment:
      MYSQL_DATABASE: product_db
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3308:3306"
    networks:
      - laravel-net

  product-service-worker:
    build:
      context: ./product-service
    container_name: product-service-worker
    command: php artisan queue:work --sleep=3 --tries=3
    volumes:
      - ./product-service:/var/www
    networks:
      - laravel-net
    depends_on:
      - redis
      - product-service-db

  # ─── Order Service ────────────────────────────────────
  order-service-app:
    build:
      context: ./order-service
    container_name: order-service-app
    volumes:
      - ./order-service:/var/www
    networks:
      - laravel-net
    depends_on:
      - order-service-db
      - redis

  order-service-nginx:
    image: nginx:stable-alpine
    container_name: order-service-nginx
    ports:
      - "8002:80"
    volumes:
      - ./order-service:/var/www
      - ./order-service/nginx.conf:/etc/nginx/conf.d/default.conf
    networks:
      - laravel-net
    depends_on:
      - order-service-app

  order-service-db:
    image: mysql:8
    container_name: order-service-db
    environment:
      MYSQL_DATABASE: order_db
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3309:3306"
    networks:
      - laravel-net