networks:
  laravel-net:
    driver: bridge

services:

  # ─── Redis ───────────────────────────────────────────
  redis:
    image: redis:alpine
    container_name: redis
    ports:
      - "6379:6379"
    networks:
      - laravel-net

  # ─── Order Service ────────────────────────────────────
  order-service-app:
    build:
      context: ./order-service
    container_name: order-service-app
    volumes:
      - ./order-service:/var/www
    networks:
      - laravel-net
    depends_on:
      - order-service-db
      - redis

  order-service-nginx:
    image: nginx:stable-alpine
    container_name: order-service-nginx
    ports:
      - "8002:80"
    volumes:
      - ./order-service:/var/www
      - ./order-service/nginx.conf:/etc/nginx/conf.d/default.conf
    networks:
      - laravel-net
    depends_on:
      - order-service-app

  order-service-db:
    image: mysql:8
    container_name: order-service-db
    environment:
      MYSQL_DATABASE: order_db
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3309:3306"
    networks:
      - laravel-net

  order-service-worker:
    build:
      context: ./order-service
    container_name: order-service-worker
    command: php artisan queue:work --sleep=3 --tries=3
    volumes:
      - ./order-service:/var/www
    networks:
      - laravel-net
    depends_on:
      - redis
      - order-service-db

  # ─── PostgreSQL untuk Hasura ──────────────────────────
  hasura-db:
    image: postgres:15-alpine
    container_name: hasura-db
    environment:
      POSTGRES_DB: hasura_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    networks:
      - laravel-net

  # ─── Hasura ───────────────────────────────────────────
  hasura:
    image: hasura/graphql-engine:v2.36.0
    container_name: hasura
    ports:
      - "8080:8080"
    networks:
      - laravel-net
    environment:
      HASURA_GRAPHQL_METADATA_DATABASE_URL: postgres://postgres:postgres@hasura-db:5432/hasura_db
      HASURA_GRAPHQL_ENABLE_CONSOLE: "true"
      HASURA_GRAPHQL_DEV_MODE: "true"
      HASURA_GRAPHQL_ENABLED_LOG_TYPES: startup, http-log, webhook-log, websocket-log, query-log
      HASURA_GRAPHQL_ADMIN_SECRET: myadminsecretkey
    depends_on:
      - hasura-db